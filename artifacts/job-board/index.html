<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Superior Patio Covers Job Board</title>
    <meta name="description" content="Superior Patio Covers — sales pipeline and job board." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFBFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10161D" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      (function () {
        try {
          var t = localStorage.getItem("spc-theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Superior Patio Covers Job Board" />
    <meta property="og:description" content="Superior Patio Covers — sales pipeline and job board." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Superior Patio Covers Job Board" />
    <meta name="twitter:description" content="Superior Patio Covers — sales pipeline and job board." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
